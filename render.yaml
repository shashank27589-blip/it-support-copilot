services:
  - type: web
    name: it-support-copilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: IT Support Copilot
      - key: APP_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: it-support-copilot
      - key: PINECONE_NAMESPACE
        value: company-it-kb
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: TOP_K
        value: "4"
      - key: MAX_RETRIES
        value: "1"
